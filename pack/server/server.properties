# Create Remastered — initial server.properties
# Locked 2026-04-18. Tier 2 tunes deferred to v0 iteration.

# === Locked Tier 1 values ===
level-seed=5252266024153750674
max-players=8
view-distance=12
simulation-distance=5
# Note: view-distance starts at 12 as a sane middle ground (your dynamic 7-20 range).
# Adjust live based on perf in v0 — Pterodactyl + Spark profiler will tell you.

# === Operational defaults ===
motd=Create Remastered — Joe AI tycoon SMP
white-list=true
enforce-whitelist=true
online-mode=true
spawn-protection=8
allow-flight=true
# Allow flight required for Mekanism jetpacks, Joe AI peer bots later, and creative-mode ops

# === Performance ===
network-compression-threshold=256
sync-chunk-writes=true
entity-broadcast-range-percentage=80

# === Difficulty / world ===
difficulty=normal
hardcore=false
gamemode=survival
force-gamemode=false
pvp=false
# PvP disabled at server level; consensual via Minecolonies alliance / War 'N Taxes per C5.3

# === Server identity ===
server-port=25565
query.port=25565
rcon.port=25575
enable-rcon=true
broadcast-rcon-to-ops=false
# rcon.password set via Pterodactyl env var (OpenBao for prod)

# === Sleep / time ===
player-idle-timeout=0

# === Tweaks ===
op-permission-level=4
function-permission-level=2
broadcast-console-to-ops=true
generate-structures=true
spawn-monsters=true
spawn-npcs=true
spawn-animals=true
generator-settings=
level-type=minecraft\:normal
# level-type: vanilla overworld; worldgen mods (Tectonic, Terralith, etc.) apply via datapack-style configs
